<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motos Retro Remastered</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-pantalla">
    <header class="marcadores">
      <p class="kilometers">0000000 KM</p>
      <p class="time">TIME</p>
    </header>

    <section class="game-titulo" aria-label="Motos Retro Remastered">
      <div class="title-main">
        <span class="title-small">Motos</span>
        <h1>Retro</h1>
      </div>
      <div class="title-sub">Remastered</div>
    </section>

   <div class="cloud cloud-left">
      <img src="imagenes/pngtree-pixel-art-white-cloud-graphic-design-vector-png-image_16480393.png" alt="">
   </div>

   <div class="cloud cloud-right">
      <img src="imagenes/pngtree-pixel-art-white-cloud-graphic-design-vector-png-image_16480393.png" alt="">
   </div>

    <section class="montanha" aria-hidden="true">
      <div class="mountain mountain-left"></div>
      <div class="mountain mountain-center"></div>
      <div class="mountain mountain-right"></div>
    </section>

    <nav class="menu" aria-label="Menú principal">
      <a href="#" class="menu-button">✹ SALIR A RODAR</a>
      <a href="#" class="menu-button">✹ OPCIONES</a>
      <a href="#" class="menu-button">✹ SALIR</a>
    </nav>

    <div class="motorcycle" aria-hidden="true"><img src="imagenes/moto.png" alt=""></div>

    <div class="calle" aria-hidden="true">
      <span class="road-line line-one"></span>
      <span class="road-line line-two"></span>
      <span class="road-line line-three"></span>
      <span class="road-line line-four"></span>
    </div>
  </main>
</body>
</html>
